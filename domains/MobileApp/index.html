        <style>
            :root {
                --boot-splash-background-color: #ffffff;
                --boot-splash-primary-color: #1f2152;
                --boot-splash-secondary-color: #c94349;
                --boot-splash-mark-size: 10rem;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --boot-splash-background-color: #242425;
                    --boot-splash-primary-color: #ffffff;
                    --boot-splash-secondary-color: #ffffff;
                }
            }

            #boot-splash {
                position: fixed;
                inset: 0;
                z-index: 2147483000;
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: var(--boot-splash-background-color);
            }

            #boot-splash svg {
                width: var(--boot-splash-mark-size);
                height: var(--boot-splash-mark-size);
            }

            #root:not(:empty) ~ #boot-splash {
                display: none;
            }

            @media (max-width: 380px) {
                :root {
                    --boot-splash-mark-size: 8rem;
                }
            }
        </style>

        <!--helmet-tags-->
